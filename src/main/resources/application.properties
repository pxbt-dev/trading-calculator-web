spring.application.name=TradingCalculatorWeb

# Logbook - Force body logging
logbook.format.style=http
logbook.write.chunk-size=10000
logbook.obfuscate.headers=Authorization,Set-Cookie

# Make sure Logbook is at TRACE level for bodies
logging.level.org.zalando.logbook=TRACE

# Reduce Spring noise
logging.level.org.springframework.web=WARN
logging.level.org.springframework.web.servlet.DispatcherServlet=WARN
logging.level.com.pxbtdev.tradingcalculatorweb=INFO

# Enable Actuator endpoints
management.endpoints.web.exposure.include=metrics,prometheus,health,info,env
management.endpoint.prometheus.access=unrestricted

# Enable metrics distribution for percentiles
management.metrics.distribution.percentiles-histogram.http.server.requests=true


# Optional: Configure specific percentiles
management.metrics.distribution.percentiles.http.server.requests=0.5,0.75,0.95,0.99